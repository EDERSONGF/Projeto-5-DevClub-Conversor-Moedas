<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
    <title>Converter Coins - Innova Circuito</title>
  </head>
  <body>
    <header>
      <div>
        <img
          class="logo-innova-circuito"
          src="./assets/convert-innova.png"
          alt="logo-convert-innova"
        />
      </div>
    </header>
    <main>
      <label>
        Converter <b>de</b>
        <select>
          <option>R$ Real Brasileiro</option>
        </select>
      </label>
      <label>
        Converter <b>para</b>
        <select class="currency-select">
          <option value="dolar">US$ Dólar americano</option>
          <option value="euro">€ Euro</option>
        </select>
      </label>

      <label
        >Valor
        <input class="input-currency" placeholder="R$ 10.000,00" />
      </label>

      <button class="convert-button">Converter</button>

      <section>
        <div class="currency-box">
          <img src="./assets/real.png" alt="logo-real-coin-convert" />
          <p class="currency">Real</p>
          <p class="currency-value-to-convert">R$ 0,00</p>
        </div>

        <div class="arrow-img">
          <img
            src="./assets/arrow.png"
            width="50px"
            alt="indicator-coin-converted"
          />
        </div>

        <div class="currency-box">
          <img class="currency-img" src="./assets/dolar.png" alt="logo-dolar-coin-converted" />
          <p class="currency" id="currency-name">Dólar Americano</p>
          <p class="currency-value">US$ 0,00</p>
        </div>
      </section>
    </main>

    <footer class="footer-resgister">
      <div class="tittle-name-footer">
        <a href=""><strong>Innova</strong>Circuito</a>
      </div>
      <p id="text-footer-resgister">
        © 2026 Developer Front-End Ederson Faria. Todos os direitos reservados.
      </p>
    </footer>
  </body>
  <script src="./script.js"></script>
</html>
